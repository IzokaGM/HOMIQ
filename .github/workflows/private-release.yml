name: Build Homika Private Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version (example 1.0.0)
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: Android versionCode (example 10000)
        required: true
        default: "10000"
        type: string
      release_notes:
        description: Optional release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: homika-private-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMIKA_VERSION_NAME: ${{ inputs.version_name }}
      HOMIKA_VERSION_CODE: ${{ inputs.version_code }}
      HOMIKA_KEY_ALIAS: homika
      HOMIKA_KEYSTORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
      HOMIKA_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOMIKA_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version_name must use X.Y.Z format, e.g. 1.0.1" >&2
            exit 1
          }
          [[ "$HOMIKA_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }

      - name: Restore private release key
        shell: bash
        env:
          HOMIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HOMIKA_RELEASE_KEYSTORE_BASE64" || {
            echo "Missing HOMIKA_RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          }
          test -n "$HOMIKA_KEYSTORE_PASSWORD" || {
            echo "Missing HOMIKA_RELEASE_KEYSTORE_PASSWORD secret" >&2
            exit 1
          }
          HOMIKA_KEYSTORE_PATH="$RUNNER_TEMP/Homika-release.jks"
          printf '%s' "$HOMIKA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$HOMIKA_KEYSTORE_PATH"
          chmod 600 "$HOMIKA_KEYSTORE_PATH"
          echo "HOMIKA_KEYSTORE_PATH=$HOMIKA_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify release certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$HOMIKA_KEYSTORE_PATH" \
            -storepass "$HOMIKA_KEYSTORE_PASSWORD" \
            -alias "$HOMIKA_KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt"
          SHA1=$(grep -m1 'SHA1:' "$RUNNER_TEMP/key-info.txt" | sed 's/.*SHA1: *//')
          echo "### Homika release certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING=$("$AAPT" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.homiq.app'"
          echo "$BADGING" | grep -q "versionCode='$HOMIKA_VERSION_CODE'"
          echo "$BADGING" | grep -q "versionName='$HOMIKA_VERSION_NAME'"

          OUT_DIR="$RUNNER_TEMP/homika-release"
          mkdir -p "$OUT_DIR"
          OUT_APK="$OUT_DIR/Homika-v$HOMIKA_VERSION_NAME.apk"
          cp "$APK" "$OUT_APK"
          sha256sum "$OUT_APK" > "$OUT_APK.sha256"

          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$OUT_APK.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=v$HOMIKA_VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homika-v${{ inputs.version_name }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_APK: ${{ steps.package.outputs.apk }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Use a new version." >&2
            exit 1
          fi

          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "$RELEASE_TAG" \
              "$RELEASE_APK" \
              "$RELEASE_CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Homika $HOMIKA_VERSION_NAME" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_APK" \
              "$RELEASE_CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Homika $HOMIKA_VERSION_NAME" \
              --generate-notes
          fi

          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`Homika-v$HOMIKA_VERSION_NAME.apk\`" >> "$GITHUB_STEP_SUMMARY"
