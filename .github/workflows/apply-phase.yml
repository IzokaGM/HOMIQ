name: Apply HOMIQ Phase Package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homika-phase-apply-release
  cancel-in-progress: false

jobs:
  apply-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find latest phase ZIP
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'HOMIQ-Phase-*.zip' -printf '%f\n' | sort -V | tail -n1)"
          test -n "${ZIP:-}" || { echo "No HOMIQ-Phase-*.zip found."; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate and extract phase ZIP
        shell: python
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          import os
          import pathlib
          import stat
          import zipfile

          archive = pathlib.Path(os.environ["PHASE_ZIP"])

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts

                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if parts and parts[0] == ".git":
                      raise SystemExit(f"Phase ZIP may not modify .git: {name}")

                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not allowed: {name}")

              z.extractall(".")

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(
            grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1
          )"

          VERSION_CODE="$(
            grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1
          )"

          test -n "${VERSION_NAME:-}" || { echo "Could not read app versionName."; exit 1; }
          test -n "${VERSION_CODE:-}" || { echo "Could not read app versionCode."; exit 1; }

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        shell: bash
        env:
          HOMIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${HOMIKA_RELEASE_KEYSTORE_BASE64:-}" || {
            echo "Missing HOMIKA_RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          }

          printf '%s' "$HOMIKA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homika-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          HOMIKA_KEYSTORE_PATH: ${{ runner.temp }}/homika-release.jks
          HOMIKA_KEYSTORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
          HOMIKA_KEY_ALIAS: homika
          HOMIKA_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Prepare release artefacts outside repository
        id: artefacts
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "${APK:-}" || { echo "Release APK not found."; exit 1; }

          RELEASE_DIR="$RUNNER_TEMP/homika-release"
          mkdir -p "$RELEASE_DIR"

          OUT="$RELEASE_DIR/Homika-v${VERSION_NAME}.apk"
          SHA="$OUT.sha256"
          SIGNATURE="$RELEASE_DIR/apk-signature.txt"

          cp "$APK" "$OUT"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "apksigner not found."; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$SIGNATURE"

          (
            cd "$RELEASE_DIR"
            sha256sum "Homika-v${VERSION_NAME}.apk" > "Homika-v${VERSION_NAME}.apk.sha256"
          )

          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Remove applied phase ZIP
        shell: bash
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f -- "$PHASE_ZIP"

      - name: Commit source changes only
        shell: bash
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: apply ${PHASE_ZIP} for Homika ${VERSION_NAME}"
            git push
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.artefacts.outputs.apk }}
          SHA: ${{ steps.artefacts.outputs.sha }}
          SIGNATURE: ${{ steps.artefacts.outputs.signature }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" "$SIGNATURE" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" "$SIGNATURE"               --title "Homika ${TAG}"               --notes "Automated Homika release ${TAG}."
          fi
