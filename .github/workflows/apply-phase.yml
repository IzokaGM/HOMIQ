name: Apply HOMIQ Phase Package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homika-phase-apply-release
  cancel-in-progress: false

jobs:
  apply-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find phase ZIP
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'HOMIQ-Phase-*.zip' -printf '%f\n' | sort -V | tail -n1)"
          test -n "${ZIP:-}" || { echo "No HOMIQ-Phase-*.zip found."; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate and extract phase
        shell: python
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          import os, pathlib, stat, zipfile
          archive = pathlib.Path(os.environ["PHASE_ZIP"])
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe path: {name}")
                  if parts and parts[0] in {".git", ".github"}:
                      raise SystemExit(f"Phase ZIP may not modify {parts[0]}: {name}")
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not allowed: {name}")
              z.extractall(".")
          pathlib.Path("UPLOAD_PATHS.txt").unlink(missing_ok=True)

      - name: Resolve release version
        id: version
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, subprocess
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          # Supports Homika's current env-overridable declarations:
          # versionName = System.getenv("HOMIKA_VERSION_NAME") ?: "1.0.0"
          # versionCode = System.getenv("HOMIKA_VERSION_CODE")?.toIntOrNull() ?: 10000
          mn = re.search(r'versionName\s*=\s*.*?\?:\s*"([^"]+)"', s)
          mc = re.search(r'versionCode\s*=\s*.*?\?:\s*(\d+)', s)

          # Also support plain Gradle declarations.
          if not mn:
              mn = re.search(r'versionName\s*=\s*"([^"]+)"', s)
          if not mc:
              mc = re.search(r'versionCode\s*=\s*(\d+)', s)

          if not mn or not mc:
              print("Version-related lines found:")
              for line in s.splitlines():
                  if "versionName" in line or "versionCode" in line or "HOMIKA_VERSION" in line:
                      print(line)
              raise SystemExit("Could not read Homika version from app/build.gradle.kts")

          name = mn.group(1)
          code = int(mc.group(1))

          def exists(v):
              return subprocess.run(
                  ["gh", "release", "view", f"v{v}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  env=os.environ.copy()
              ).returncode == 0

          if exists(name):
              parts = name.split(".")
              if len(parts) != 3 or not all(x.isdigit() for x in parts):
                  raise SystemExit("versionName must use MAJOR.MINOR.PATCH.")
              old_name, old_code = name, code
              a,b,c = map(int, parts)
              name = f"{a}.{b}.{c+1}"
              code += 1

              # Replace only the detected default values.
              s = s[:mn.start(1)] + name + s[mn.end(1):]
              mc2 = re.search(r'versionCode\s*=\s*.*?\?:\s*(\d+)', s)
              if not mc2:
                  mc2 = re.search(r'versionCode\s*=\s*(\d+)', s)
              s = s[:mc2.start(1)] + str(code) + s[mc2.end(1):]
              p.write_text(s, encoding="utf-8")
              print(f"Auto-bumped {old_name} ({old_code}) -> {name} ({code})")

          if exists(name):
              raise SystemExit(f"Release v{name} already exists.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"name={name}\ncode={code}\n")
          print(f"Homika version: {name} ({code})")

      - name: Build debug
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Remove phase ZIP and commit
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f -- "$PHASE_ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply ${PHASE_ZIP}"
            git push
          fi

      - name: Decode release keystore
        env:
          HOMIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${HOMIKA_RELEASE_KEYSTORE_BASE64:-}"
          printf '%s' "$HOMIKA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homika-release.jks"

      - name: Build signed release
        env:
          HOMIKA_RELEASE_STORE_FILE: ${{ runner.temp }}/homika-release.jks
          HOMIKA_RELEASE_STORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_STORE_PASSWORD }}
          HOMIKA_RELEASE_KEY_ALIAS: homika
          HOMIKA_RELEASE_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_STORE_PASSWORD }}
          HOMIKA_VERSION_NAME: ${{ steps.version.outputs.name }}
          HOMIKA_VERSION_CODE: ${{ steps.version.outputs.code }}
          HOMIKA_RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          HOMIKA_RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease

      - name: Prepare and verify APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          OUT="Homika-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$OUT" | head -n1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.homiq.app'"
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"
          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" "$APK" \
            --title "Homika v${VERSION_NAME}" \
            --notes "Homika ${VERSION_NAME}

          Applied package: ${PHASE_ZIP}"

      - uses: actions/upload-artifact@v4
        with:
          name: Homika-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
