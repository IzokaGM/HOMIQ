name: Apply HOMIQ Phase Package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homika-phase-apply-release
  cancel-in-progress: false

jobs:
  apply-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find latest HOMIQ phase ZIP
        id: phase
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'HOMIQ-Phase-*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "${ZIP:-}" ]; then
            echo "No HOMIQ-Phase-*.zip found in repository root."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Validate and extract phase
        shell: python
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          import os
          import pathlib
          import stat
          import zipfile

          archive = pathlib.Path(os.environ["PHASE_ZIP"])
          root = pathlib.Path(".").resolve()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts

                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if parts and parts[0] in {".git", ".github"}:
                      raise SystemExit(
                          f"Phase ZIP may not modify {parts[0]}: {name}"
                      )

                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {name}")

              z.extractall(root)

          marker = root / "UPLOAD_PATHS.txt"
          if marker.exists():
              marker.unlink()

      - name: Resolve Homika release version
        id: version
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")

          name_match = re.search(
              r'(?m)^(\s*versionName\s*=\s*)"([^"]+)"',
              text,
          )
          code_match = re.search(
              r'(?m)^(\s*versionCode\s*=\s*)(\d+)',
              text,
          )

          if not name_match or not code_match:
              raise SystemExit(
                  "Could not read versionName/versionCode from app/build.gradle.kts"
              )

          version_name = name_match.group(2)
          version_code = int(code_match.group(2))

          def release_exists(version: str) -> bool:
              result = subprocess.run(
                  ["gh", "release", "view", f"v{version}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  env=os.environ.copy(),
              )
              return result.returncode == 0

          auto_bumped = False

          if release_exists(version_name):
              parts = version_name.split(".")
              if (
                  len(parts) == 3
                  and all(part.isdigit() for part in parts)
              ):
                  major, minor, patch = map(int, parts)
                  version_name = f"{major}.{minor}.{patch + 1}"
              else:
                  raise SystemExit(
                      "Current release already exists and versionName is not "
                      "simple MAJOR.MINOR.PATCH format."
                  )

              version_code += 1
              auto_bumped = True

              text = (
                  text[:name_match.start(2)]
                  + version_name
                  + text[name_match.end(2):]
              )

              code_match = re.search(
                  r'(?m)^(\s*versionCode\s*=\s*)(\d+)',
                  text,
              )
              text = (
                  text[:code_match.start(2)]
                  + str(version_code)
                  + text[code_match.end(2):]
              )

              gradle.write_text(text, encoding="utf-8")

          if release_exists(version_name):
              raise SystemExit(
                  f"Release v{version_name} already exists even after version resolution."
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"name={version_name}\n")
              fh.write(f"code={version_code}\n")
              fh.write(f"auto_bumped={'true' if auto_bumped else 'false'}\n")

          print(
              f"Homika release version: {version_name} ({version_code})"
          )
          if auto_bumped:
              print("Version was auto-bumped because the previous release already exists.")

      - name: Build Homika debug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Mark phase build confirmation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("PROJECT_CONTEXT.md")
          if not p.exists():
              raise SystemExit(0)

          text = p.read_text(encoding="utf-8")
          text = re.sub(
              r"- \[ \] (Confirm Phase [^\n]*?build successfully[^\n]*)",
              r"- [x] \1",
              text,
          )
          p.write_text(text, encoding="utf-8")

      - name: Remove applied phase ZIP
        shell: bash
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: rm -f -- "$PHASE_ZIP"

      - name: Commit and push applied phase
        shell: bash
        env:
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: apply ${PHASE_ZIP} for Homika ${VERSION_NAME} (${VERSION_CODE})"
            git push
          fi

      - name: Decode Homika release keystore
        shell: bash
        env:
          HOMIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOMIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${HOMIKA_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Missing HOMIKA_RELEASE_KEYSTORE_BASE64 GitHub Secret."
            exit 1
          fi

          printf '%s' "$HOMIKA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/homika-release.jks"

      - name: Build signed Homika release
        shell: bash
        env:
          HOMIKA_RELEASE_STORE_FILE: ${{ runner.temp }}/homika-release.jks
          HOMIKA_RELEASE_STORE_PASSWORD: ${{ secrets.HOMIKA_RELEASE_STORE_PASSWORD }}
          HOMIKA_RELEASE_KEY_ALIAS: ${{ secrets.HOMIKA_RELEASE_KEY_ALIAS }}
          HOMIKA_RELEASE_KEY_PASSWORD: ${{ secrets.HOMIKA_RELEASE_KEY_PASSWORD }}
          HOMIKA_RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          HOMIKA_RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease

      - name: Prepare signed APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "Signed release APK not found."
            exit 1
          fi

          OUT="Homika-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "Prepared $OUT"

      - name: Verify signed APK
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.path }}
          EXPECTED_VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"

          echo "$BADGING" \
            | grep -F "package: name='com.homiq.app'"

          echo "$BADGING" \
            | grep -F "versionName='${EXPECTED_VERSION}'"

          echo "$BADGING" \
            | grep -F "versionCode='${EXPECTED_CODE}'"

      - name: Publish Homika GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
          PHASE_ZIP: ${{ steps.phase.outputs.zip }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" "$APK" \
            --title "Homika v${VERSION_NAME}" \
            --notes "Homika ${VERSION_NAME}

          Applied package: ${PHASE_ZIP}

          Private Android release."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homika-debug-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homika-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
